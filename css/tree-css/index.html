<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />

      <title>CSS Tree Generator</title>
      <link rel="stylesheet" href="tree-css.css" />
      <link rel="stylesheet" href="../../menu.css" />
      <script defer src="tree-css.js"></script>

   <body>
      <div id="container">
         <div id="backgroundscene"></div>

      <section class="menu-container">

            <p class="menu-info-text">

<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Helicopter Animation</title>
      <link rel="stylesheet" href="helicopter.css" />
      <link rel="stylesheet" href="../../menu.css" />
      <script defer src="../../menu.js"></script>
   </head>
   <body>
      <div class="sky"></div>
      <div class="stars"></div>
      <div class="build-cont">
         <div class="building">
            <div class="helipad"></div>
         </div>
      </div>
      <div class="helicopter">
         <div class="legs">
            <div class="body">
               <div class="propeller-s"></div>
               <div class="connector">
                  <div class="bearing">
                     <div class="propeller-l"></div>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <div class="clouds"></div>
      <div class="dark-screen"></div>
      <div class="headlights">
         <div class="light"></div>
      </div>

      <section class="menu-container">
         <form action="../../#css">
            <button class="menu-home-btn home" type="submit"></button>
         </form>
         <button class="menu-info-btn-expand expand"></button>
         <dialog class="menu-info">
            <button class="menu-info-btn-contract contract"></button>
            <h2 class="menu-info-heading ft-large">Helicopter Animation</h2>
            <p class="menu-info-text">
               This animation is of a helicopter as it flies in the air and
               between buildings throughout the day and night. Relax and watch!
            </p>
         </dialog>
      </section>
   </body>
</html>
